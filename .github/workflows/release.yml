name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the installable .tgz
        run: |
          npm run check
          # `npm pack` names scoped packages alumos-dsh-session-cleaner-<version>.tgz,
          # so take the real filename instead of rebuilding it from the version.
          TARBALL=$(npm pack --silent | tail -n 1)
          mv "$TARBALL" "dsh-session-cleaner-${VERSION}.tgz"
          ls -l "dsh-session-cleaner-${VERSION}.tgz"

      - name: Build the source .zip
        run: |
          git archive --format=zip \
            --prefix="dsh-session-cleaner-${VERSION}/" \
            -o "dsh-session-cleaner-${VERSION}.zip" HEAD

      - name: Checksums
        run: |
          sha256sum "dsh-session-cleaner-${VERSION}.tgz" "dsh-session-cleaner-${VERSION}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm (only when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          npm publish --access public

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "dsh-session-cleaner-${VERSION}.tgz" \
            "dsh-session-cleaner-${VERSION}.zip" \
            SHA256SUMS.txt
